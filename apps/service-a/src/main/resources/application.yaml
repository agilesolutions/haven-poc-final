spring:
  application:
    name: service-a
    version: 1.0.0

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${OAUTH2_CLIENT_ID:service-a}
            client-secret: ${OAUTH2_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: openid,profile,email
        provider:
          keycloak:
            token-uri: ${OAUTH2_TOKEN_URI:http://keycloak:8080/auth/realms/demo/protocol/openid-connect/token}
            issuer-uri: ${OAUTH2_ISSUER_URI:http://keycloak:8080/auth/realms/demo}

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,traces
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
    enable:
      jvm: true
      process: true
      logback: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://lgtm-gateway:4317}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.agilesolutions: ${APP_LOG_LEVEL:DEBUG}
    org.springframework.security: ${SECURITY_LOG_LEVEL:DEBUG}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  config: classpath:logback-spring.xml

service:
  b:
    url: ${SERVICE_B_URL:http://service-b:8080}
    timeout-ms: ${SERVICE_B_TIMEOUT_MS:5000}
    max-retries: ${SERVICE_B_MAX_RETRIES:3}

