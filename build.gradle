plugins {
    id 'java'
}

allprojects {
    group = 'com.agilesolutions'
    version = '0.1.0'

    repositories {
        mavenCentral()
        maven {
            url = uri('https://repo.spring.io/release')
        }
    }
}

subprojects {
    apply plugin: 'java'

    sourceCompatibility = 25
    targetCompatibility = 25

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs << '-parameters'
    }
}

